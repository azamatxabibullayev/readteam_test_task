<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Analyser{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <a href="/">Карточки</a>
    <a href="/records">Записи</a>
    <form action="/go" method="get" class="goto">
      <input name="id" placeholder="перейти к id" size="12" inputmode="numeric">
      <button>→</button>
    </form>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
